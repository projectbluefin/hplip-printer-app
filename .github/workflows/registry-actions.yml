name: Publish signed FSDK OCI image

# Pushes to testing (each one already passed the merge queue) are rebuilt,
# verified and published. Reverting a PR is the rollback.
on:
  push:
    branches: [testing]

# One run at a time; a newer push replaces any run still pending, so a commit
# superseded while a publish is in flight is never built and gets no
# sha-<commit> tag. The tag step refuses to move tags backwards.
concurrency:
  group: oci-publish
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hplip-printer-app

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive version and FSDK provenance
        id: release
        run: |
          set -euo pipefail
          version="$(< VERSION)"
          source_tag="$(sed -n 's/^    # source-tag: \(debian\/[^[:space:]]*\)$/\1/p' elements/printer-app/hplip.bst)"
          [[ "$source_tag" =~ ^debian/([0-9]+\.[0-9]+\.[0-9]+)\+dfsg0-[0-9]+$ ]]
          upstream_source="${BASH_REMATCH[1]}"
          # An optional -N suffix marks an OCI-only revision of the same
          # upstream version.
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9]+)?$ ]]
          upstream_version="${BASH_REMATCH[1]}"
          [[ "$upstream_source" == "$upstream_version" ]]
          junction_ref="$(sed -n -E 's/^[[:space:]]*ref: (.*-g)?([0-9a-f]{40})$/\2/p' elements/fsdk-containers.bst)"
          [[ "$junction_ref" =~ ^[0-9a-f]{40}$ ]]
          upstream="$(mktemp -d)"
          trap 'rm -rf "$upstream"' EXIT
          git -C "$upstream" init -q
          git -C "$upstream" fetch -q --depth=1 https://github.com/projectbluefin/fsdk-containers.git "$junction_ref"
          junction="$(git -C "$upstream" show FETCH_HEAD:elements/freedesktop-sdk.bst)"
          read -r fsdk_version fsdk_ref <<< "$(sed -n 's/^[[:space:]]*ref: freedesktop-sdk-\(.*\)-0-g\([0-9a-f]\{40\}\)$/\1 \2/p' <<< "$junction")"
          [[ -n "$fsdk_version" && "$fsdk_ref" =~ ^[0-9a-f]{40}$ ]]
          # FSDK labels come from the pinned junction, so a bare ref bump of
          # elements/fsdk-containers.bst is a complete update.
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: just
      - name: Install image build dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      # Warm start as in fsdk-ci.yml: bst-cache.yml refills this cache from
      # testing, and the printing base is seeded from its signed bundle.
      - name: Compute BuildStream cache key
        id: bst-key
        env:
          ARCH: ${{ matrix.arch }}
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'hplip-printer-app.c', 'hplip-plugin-verify.c', 'hplip-plugin-verify.h', 'hplip-download-policy.c', 'hplip-download-policy.h', 'hplip-plugin-arch.c', 'hplip-plugin-arch.h', 'hplip-printer-app.1', 'hplip-printer-app.service', 'testpage.ps', 'HP', 'scripts/hplip-plugin-state.sh', 'VERSION') }}
        run: echo "prefix=bst-v1-${ARCH}-${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.bst-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.bst-key.outputs.prefix }}
            bst-v1-${{ matrix.arch }}-
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Seed printing base
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Fetch, build and print with native OCI image
        run: just bst --network-retries 5 build oci/hplip-printer-app.bst && just verify
      - name: Stamp verified image with release provenance
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          source_image=ghcr.io/projectbluefin/hplip-printer-app:build
          container="$(podman create "$source_image")"
          trap 'podman rm "$container" >/dev/null 2>&1 || true' EXIT
          podman commit --format oci \
            --change "LABEL org.opencontainers.image.version=$VERSION" \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.opencontainers.image.created=$CREATED" \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --change "LABEL io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "$container" "$source_image"
          podman save --format oci-archive -o "hplip-${{ matrix.arch }}.oci" "$source_image"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hplip-${{ matrix.arch }}
          path: hplip-${{ matrix.arch }}.oci
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hplip-*
          merge-multiple: true
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
      - name: Generate BuildStream-native SPDX SBOM
        run: just fetch && just sbom
      # Everything is pushed, signed, attested and verified by digest; the
      # human-readable version tags are created only in the final step, so a
      # failed release never leaves a tagged, unsigned image behind.
      - name: Publish architecture manifests and OCI index by digest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="${image%/*}/hplip-printer-app"
          authfile="$HOME/.docker/config.json"
          probe_tag="sha-${REVISION}"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${image}:${probe_tag}" 2>&1)"; then
            printf 'Refusing to overwrite immutable tag %s:%s\n' "$image" "$probe_tag" >&2
            exit 1
          elif [[ "${probe,,}" != *'manifest unknown'* && "${probe,,}" != *'name unknown'* ]]; then
            printf 'Could not prove %s:%s absent: %s\n' "$image" "$probe_tag" "$probe" >&2
            exit 1
          fi
          sources=()
          for arch in x86_64 aarch64; do
            platform="$([[ "$arch" == x86_64 ]] && echo amd64 || echo arm64)"
            archive="hplip-${arch}.oci"
            layout="$(tar -xOf "$archive" index.json)"
            jq -e '.manifests | length == 1' <<< "$layout" >/dev/null
            digest="$(jq -r '.manifests[0].digest' <<< "$layout")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras copy --from-oci-layout "${archive}@${digest}" "${image}@${digest}"
            source="${image}@${digest}"
            [[ "$(skopeo inspect --no-tags --authfile "$authfile" "docker://${source}" | jq -r .Architecture)" == "$platform" ]]
            skopeo inspect --config --authfile "$authfile" "docker://${source}" | jq -e \
              --arg version "$VERSION" --arg revision "$REVISION" --arg created "$CREATED" \
              --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
              '.config.User == "65532:65532" and
               .config.Labels["org.opencontainers.image.title"] == "hplip-printer-app" and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref'
            sources+=("$source")
            echo "${arch}-digest=$digest" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create --dry-run \
            --tag "${image}:${VERSION}" \
            --annotation 'index:org.opencontainers.image.title=hplip-printer-app' \
            --annotation 'index:org.opencontainers.image.description=HPLIP print-only Printer Application built from freedesktop-sdk' \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation 'index:org.opencontainers.image.licenses=Apache-2.0 AND GPL-2.0-or-later' \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${sources[@]}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "${image}@${digest}" index.json
          [[ "$(skopeo inspect --raw --authfile "$authfile" "docker://${image}@${digest}" | sha256sum | cut -d' ' -f1)" == "${digest#sha256:}" ]]
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign index and architecture manifests and attach signed SPDX SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=hplip-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            hplip-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify registry index, signatures, SBOM and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          X86_64_DIGEST: ${{ steps.image.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.image.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@${GITHUB_REF}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${SBOM_DIGEST}"
          for arch_digest in "$X86_64_DIGEST" "$AARCH64_DIGEST"; do
            cosign verify --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${arch_digest}"
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" | jq -e \
            --arg digest "$SBOM_DIGEST" \
            '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == 'amd64 arm64' ]]
          [[ "$(jq -r '[.manifests[].digest] | sort | join(" ")' <<< "$raw")" == "$(printf '%s\n' "$X86_64_DIGEST" "$AARCH64_DIGEST" | sort | paste -sd ' ')" ]]
          jq -e --arg version "$VERSION" --arg revision "$REVISION" --arg created "$CREATED" \
            --arg fsdk_version "$FSDK_VERSION" --arg fsdk_ref "$FSDK_REF" \
            '.annotations["org.opencontainers.image.title"] == "hplip-printer-app" and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["io.projectbluefin.fsdk.version"] == $fsdk_version and
             .annotations["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$raw"
      # sha-<commit> is immutable; <VERSION>, its per-arch tags and stable
      # move to the newest verified testing commit, never to an ancestor of
      # the commit :stable already carries (e.g. a re-run of an older run).
      - name: Tag the verified image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          X86_64_DIGEST: ${{ steps.image.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.image.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          if current="$(skopeo inspect --raw "docker://${IMAGE}:stable" 2>&1)"; then
            current="$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<< "$current")"
            [[ "$current" =~ ^[0-9a-f]{40}$ ]] || {
              printf 'Cannot read the revision of %s:stable\n' "$IMAGE" >&2
              exit 1
            }
            git merge-base --is-ancestor "$current" "$REVISION" || {
              printf 'Refusing to move tags backwards: %s does not descend from stable %s\n' "$REVISION" "$current" >&2
              exit 1
            }
          elif [[ "${current,,}" != *'manifest unknown'* && "${current,,}" != *'name unknown'* ]]; then
            printf 'Could not read %s:stable: %s\n' "$IMAGE" "$current" >&2
            exit 1
          fi
          oras tag "${IMAGE}@${DIGEST}" "sha-${REVISION}"
          oras tag "${IMAGE}@${X86_64_DIGEST}" "${VERSION}-x86_64"
          oras tag "${IMAGE}@${AARCH64_DIGEST}" "${VERSION}-aarch64"
          oras tag "${IMAGE}@${DIGEST}" "${VERSION}" stable
          [[ "$(skopeo inspect --raw "docker://${IMAGE}:${VERSION}" | sha256sum | cut -d' ' -f1)" == "${DIGEST#sha256:}" ]]
