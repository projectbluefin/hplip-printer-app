name: HP plugin signature verification

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch official verification fixtures (never execute the archive)
        shell: bash
        run: |
          set -euo pipefail
          # The runtime UID cannot traverse the runner's home, so everything
          # the test reads lives in a world-readable directory under /tmp.
          fixtures=/tmp/hp-verify/fixtures
          install -d -m 0755 /tmp/hp-verify "$fixtures" /tmp/hp-verify/src
          cp -r tests hplip-plugin-verify.c hplip-plugin-verify.h /tmp/hp-verify/src/
          # The key the OCI image ships; HP signs 3.25.6 and later with it.
          cp files/hplip-plugin-signing-key-2025.asc "$fixtures/signing-key.asc"
          # Must match HPLIP's version in elements/printer-app/hplip.bst.
          for suffix in run run.asc; do
            curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
              "https://www.openprinting.org/download/printdriver/auxfiles/HP/plugins/hplip-3.26.4-plugin.$suffix" \
              -o "$fixtures/plugin.$suffix"
          done
          chmod -R a+rX /tmp/hp-verify
      - name: Verify offline as the OCI runtime UID
        shell: bash
        run: |
          set -euo pipefail
          fixtures=/tmp/hp-verify/fixtures
          cd /tmp
          # All verification, including first key import, runs without networking.
          sudo unshare --net -- setpriv --reuid=65532 --regid=65532 --clear-groups \
            env HP_PLUGIN="$fixtures/plugin.run" \
              HP_PLUGIN_SIGNATURE="$fixtures/plugin.run.asc" \
              HP_SIGNING_KEY="$fixtures/signing-key.asc" \
              HP_SIGNING_FINGERPRINT=82FFA7C6AA7411D934BDE173AC69536A2CF3A243 \
              python3 /tmp/hp-verify/src/tests/test-plugin-verification.py
      - name: Remove proprietary test bytes
        if: always()
        run: rm -rf /tmp/hp-verify
