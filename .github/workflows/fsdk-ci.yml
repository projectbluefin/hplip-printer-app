name: FSDK OCI CI

on:
  pull_request:
    branches: [testing, stable]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-print:
    name: FSDK image and socket-sink (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host requirements
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Validate BuildStream graph
        if: env.FULL_BUILD != 'true'
        run: just validate
      - name: Compute BuildStream cache key
        id: bst-key
        if: env.FULL_BUILD == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'hplip-printer-app.c', 'hplip-printer-app.1', 'hplip-printer-app.service', 'testpage.ps', 'HP', 'VERSION') }}
        run: echo "prefix=bst-v1-${ARCH}-${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        if: env.FULL_BUILD == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.bst-key.outputs.prefix }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.bst-key.outputs.prefix }}
            bst-v1-${{ matrix.arch }}-
      - name: Build image
        if: env.FULL_BUILD == 'true'
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/hplip-printer-app.bst
      - name: Build and print through real OCI image
        if: env.FULL_BUILD == 'true'
        run: just verify
